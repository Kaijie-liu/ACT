# ACT Back-End Configuration
#
# Canonical source for ALL back-end settings (runtime, verification, generation).
# CI (.github/workflows/act-bab.yml) relies on these defaults.
#
# Precedence:  CLI flag  >  environment variable  >  this file  >  code default
# Env vars:    ACT_SOLVER / ACT_DEVICE / ACT_DTYPE

backend:

  # ── Verification Runtime (global) ────────────────────────────────────────────────────

  # Solver backend for LP/MILP verification.
  #   "auto"   – try Gurobi first, fall back to TorchLP
  #   "gurobi"  – exact MILP/LP via Gurobi (requires license)
  #   "torchlp" – PyTorch-tensor LP (Adam + penalty + box projection,
  #               GPU-capable, no license)
  solver: "torchlp"

  # Compute device.
  #   "cpu"  – run on CPU (CI default, always available)
  #   "cuda" – run on NVIDIA GPU (requires CUDA toolkit)
  #   "gpu"  – alias for "cuda"
  device: "cpu"

  # Floating-point precision for all tensors.
  #   "float64" – double precision (more accurate, slower)
  #   "float32" – single precision (faster, may cause numerical drift)
  dtype: "float64"

  # Print extra diagnostic output across all commands.
  verbose: false

  hybridz:
    timeout: null
    engine: "dense_hz_objbound"
    operator_exact_budget: 0
    # One deterministic exact phase-cell projection and one input LP.  It is
    # disabled by default and, when enabled, shares the global HybridZ wall
    # budget with the ordinary all-exact root path.
    operator_phase_projection_time_limit: 0.0
    # Candidate-only property-focused K4 exact phase-conflict cliques.
    # Zero is a strict identity-preserving no-op; a positive value is the
    # complete raw-property/certificate/materialization wall-clock budget.
    operator_phase_clique_time_limit: 0.0
    operator_materialize_add: true
    # Optional proof-carrying constrained bounds for at most K unstable ReLU
    # rows.  Disabled by default; every accepted bound is independently
    # checked against the original HZ constraints.
    preactivation_lp_budget: 0
    preactivation_lp_time_limit: 0.0
    # Property-ranked row-local ADD correlation shadows.  Only selected
    # downstream affine rows are recomposed over the pre-materialization ADD
    # generators; disabled until the toy/build-only ladder promotes it.
    property_correlation_budget: 0
    property_correlation_time_limit: 0.0
    # Scan only unstable residual-join rows and retain only outward-proven
    # stable phases.  Disabled until its controlled and iid2 gates pass.
    residual_phase_screen: false
    residual_bound_screen: false
    # Optional property-driven ReLU residual normal form.  Disabled by
    # default; final ASSERT rivals only schedule explicit rows and never act
    # as proof authority.
    property_residual_budget: 0
    property_residual_time_limit: 0.0
    property_residual_max_adjoint_cells: 30000000
    property_residual_pool_per_rival: 8
    # Safe-only Fraction-audited final DENSE(RELU(.)) property folding.
    property_tail_upper: false
    # Bounded two-exact-ReLU factor-space micro-RLT.  Both knobs are coupled
    # and default off; the lifted parent is queried only before exact phase
    # enumeration, where these rows can tighten the binary relaxation.
    property_micro_rlt_product_cap: 0
    # `first`/`second` select one complete directed four-row RLT packet.
    # They remain sound but candidate-only; `both` preserves the symmetric
    # lift and is the disabled/default profile.
    property_micro_rlt_packet_mode: both
    property_micro_rlt_parent_prefilter_seconds: 0.0
    # Non-authoritative single-instance diagnostic: stop after the optional
    # SAFE-only parent prefilter and never enumerate exact phase children.
    property_micro_rlt_parent_only_diagnostic: false
    # Candidate extension for property-tail source planes.  It requires both
    # property_tail_upper and operator ADD materialization, and stays off by
    # default until its controlled gates earn promotion.
    property_tail_add_source_planes: false
    # Optional candidate-only negative ReLU lower-slope optimization for the
    # folded property tail.  Exact Fraction reconstruction and grouped
    # baseline fallback remain mandatory.
    property_tail_alpha_steps: 0
    property_tail_alpha_time_limit: 0.0
    property_tail_alpha_learning_rate: 0.08
    property_tail_alpha_max_cells: 50000000
    property_tail_alpha_device: "auto"
    # Candidate-only dyadic mixture grid.  Zero disables it; positive values
    # require the safe property tail and enabled alpha optimization.
    property_tail_mixture_grid_bits: 0
    # Candidate-only two-neuron projected PairHull alternatives.  The budget
    # caps the global pool of unique disjoint pairs (each rival may use at
    # most one); budget and time limit are enabled together.  Exact Fraction
    # reconstruction and the original property rows remain mandatory.
    property_tail_pairhull_budget: 0
    property_tail_pairhull_time_limit: 0.0
    # Truncated property-dual replay to an earlier dominating residual ADD.
    # One crosses exactly one full residual block; zero disables the candidate.
    property_tail_suffix_blocks: 0
    property_tail_suffix_alpha_steps: 0
    property_tail_suffix_alpha_time_limit: 0.0
    property_tail_suffix_alpha_device: "auto"
    # Proof-carrying, independently replayed query-dual feedback.  Targets may
    # be preconfigured while disabled; steps=0 requires a zero time limit.
    query_dual_feedback_targets: []
    query_dual_feedback_steps: 0
    query_dual_feedback_time_limit: 0.0
    query_dual_feedback_block_size: 1024
    query_dual_feedback_device: "cuda"
    # Optional batched CUDA Lagrangian candidates.  They never authorize a
    # verdict; original-CSR long-double checking is mandatory.
    gpu_dual_steps: 0
    gpu_dual_time_limit: 0.0
    gpu_dual_row_topk: 0
    gpu_dual_learning_rate: 0.08
    lp_prefilter_fraction: 0.20
    lp_prefilter_max_seconds: 8.0

  # ── BaBVerification ────────────────────────────────────────────────────────

  # Wall-clock budget in seconds for both single execution and BaB verification.
  timeout: 60.0

  bab:
    # Enable Branch-and-Bound refinement (true) or single execution (false).
    enabled: true

    # Maximum depth of the BaB search tree.
    max_depth: 3

    # Maximum number of subproblems (nodes) to explore.
    max_nodes: 10

    # Maximum pending frontier leaves to retain; 0 disables eviction.
    frontier_cap: 0

    # Uniform fanout for input-domain splits; 2 preserves binary splitting.
    input_split_fanout: 2

    # Branching strategy.
    #   "random" – uniform random input-dimension split (baseline)
    #   "babsr"  – ReLU neuron-split scored by dual ν + bound slope/intercept
    #   "fsb"    – filtered smart branching (babsr top-k + bound re-evaluation)
    # NOTE: "babsr"/"fsb" perform real neuron-split only on a dual tier
    #       (solver_tier "dual_alpha" or "dual_alpha_eta"); on "lp" they use the
    #       width-based baseline.
    branching_method: "random"

    # How to select the next wave of subproblems when the pool exceeds the
    # batch (tensor) size.
    #   "random" – uniform-random selection (baseline)
    #   "topk"   – keep the top-k by (depth, lower-bound): deeper (more refined)
    #              and smaller lower-bound (closer to a counterexample) rank higher
    bounding_method: "random"

    # TopKBounding order policy: depth_lb (default), greedy, or sa.
    bounding_order: "depth_lb"

    # Simulated-annealing cooling rate for bounding_order = "sa".
    sa_cooling_rate: 0.99

    # TopKBounding score weights (only used when bounding_method = "topk").
    # Metrics are min-max normalised within the pool; defaults give depth and
    # lower-bound 50% each.
    bounding_depth_weight: 0.5
    bounding_bound_weight: 0.5

    # ── Dual-tier knobs (α/η optimization for DualSolver BaB) ────────────
    # Solver tier for BaB bound computation:
    # Source of truth: act.back_end.config.VALID_SOLVER_TIERS
    #   "lp"               – LP/MILP backend
    #   "dual"             – DualSolver (linear-relaxation dual, no iterative optimization)
    #   "dual_alpha"       – DualSolver with Lagrange-relaxed lower-slope optimization (Adam on α ∈ [0,1])
    #   "dual_alpha_eta"   – DualSolver with joint α + η (split-constraint KKT multipliers)
    solver_tier: "lp"

    # Number of Adam iterations for α/η optimization (only used in
    # dual_alpha / dual_alpha_eta tiers).
    dual_n_iters: 50

    # Learning rate for α (ReLU lower-bound slope, clamped to [0, 1]).
    lr_alpha: 0.1

    # Learning rate for η (split-constraint KKT multipliers, clamped ≥ 0).
    lr_beta: 0.1

    # Adam ExponentialLR decay per iteration. 1.0 = no decay.
    lr_decay: 0.98

    # Inherit optimized (α, η) from parent BaB node into children (incremental-start).
    incremental_start_enabled: true

    # Per-spec α (tighter bounds, M× memory) vs shared α (looser, 1× memory).
    per_class_alpha: true

    # Track logical BaB node ids and parent ids in TopKBounding.
    provenance_enabled: false

  # ── Network Generation (net_factory) ────────────────────────────────────
  # Controls how many networks to generate, where, and TF filtering.
  # Architecture sampling DSL (family definitions, input/output specs)
  # lives in gen_config_path — a separate file with its own schema.

  generation:
    # Path to the architecture sampling config (families, specs, etc.).
    gen_config_path: "act/back_end/examples/config_gen_act_net.yaml"

    # Directory where generated .json network files are written.
    output_dir: "act/back_end/examples/nets"

    # Number of networks to generate per run.
    num_instances: 15

    # Random seed for reproducible generation.
    base_seed: 42

    # Prefix prepended to every generated filename.
    name_prefix: "cfg_seed"

    # Transfer-function targets for layer filtering.
    #   null            – no filtering, all layer types allowed
    #   ["interval"]    – only layers supported by interval TF
    #   ["interval", "hybridz"] – layers supported by both TFs
    tf_targets: null

    # How to combine layer sets when multiple tf_targets are given.
    #   "intersection" – keep only layers supported by ALL targets (stricter)
    #   "union"        – keep layers supported by ANY target (more permissive)
    registry_mode: "intersection"

    # When to stop generating.
    #   "basic" – generate exactly num_instances, then stop
    #   "full"  – keep generating until every target layer type is covered
    coverage_mode: "basic"

    # Maximum attempts in "full" coverage mode before giving up.
    coverage_max_attempts: 1000

    # Print a layer-coverage summary after generation finishes.
    coverage_report: true

    # Write a manifest.json listing all generated network filenames.
    write_manifest: true
