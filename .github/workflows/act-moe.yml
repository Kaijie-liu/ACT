name: ACT MoE Route-A Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "act/back_end/moe/**"
      - "act/pipeline/moe/**"
      - "act/back_end/hybridz_tf/hybridz_tf.py"
      - "act/back_end/solver/solver_hz.py"
      - ".github/workflows/act-moe.yml"
  push:
    branches: [main]
    paths:
      - "act/back_end/moe/**"
      - "act/pipeline/moe/**"
      - "act/back_end/hybridz_tf/hybridz_tf.py"
      - "act/back_end/solver/solver_hz.py"
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}
  ACT_CI_MODE: "true"

jobs:
  route-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy pyyaml psutil sortedcontainers
      - name: Compile MoE modules
        run: python -m compileall -q act/back_end/moe act/pipeline/moe
      - name: Run Route-A regression suite
        run: python -m unittest act.back_end.moe.test_moe
